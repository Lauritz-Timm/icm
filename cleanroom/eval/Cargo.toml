[package]
name = "icm-cleanroom-eval"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the evaluator independent of the product workspace. It must not compile
# or link product crates: synthetic SQLite fixtures are constructed from the
# committed evaluator-owned schema and the candidate is invoked as a process.
[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.34", features = ["bundled"] }
